# Two API instances sharing one volume (CSV files + SQLite database).
# Both containers mount the same named volume at /data and coordinate through
# SQLite write transactions plus per-shard, incarnation-fenced leases.
#
# Rolling-restart safety: a newly started instance only reclaims leases whose
# heartbeat is older than LEASE_TIMEOUT_SECONDS. It never deletes a live peer's
# staging files, and a lagging worker whose lease was taken over fences every
# file operation and backs off instead of touching the successor's result.
x-api-env: &api-env
  DATA_DIR: /data
  WORKER_INTERVAL_SECONDS: "0.1"
  # Lease heartbeat deadline. A peer may take over only after a lease has been
  # silent for this long, so live instances are never disturbed.
  LEASE_TIMEOUT_SECONDS: "30"
  TASK_TIMEOUT_SECONDS: "120"

services:
  api-a:
    build: .
    image: feature-withdrawal:latest
    environment:
      <<: *api-env
      INSTANCE_ID: api-a
    ports:
      - "8001:8000"
    volumes:
      - shared-data:/data
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  api-b:
    image: feature-withdrawal:latest
    build: .
    environment:
      <<: *api-env
      INSTANCE_ID: api-b
    ports:
      - "8002:8000"
    volumes:
      - shared-data:/data
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

volumes:
  shared-data:
